<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner Absensi — Smart Teacher Bootcamp 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap');

  :root {
    --blue:    #0ea5e9;
    --blue-dk: #0369a1;
    --blue-lt: #e0f2fe;
    --gold:    #f59e0b;
    --gold-lt: #fef3c7;
    --green:   #10b981;
    --green-lt:#d1fae5;
    --red:     #ef4444;
    --red-lt:  #fee2e2;
    --warn:    #f59e0b;
    --warn-lt: #fef9c3;
    --bg:      #f0f9ff;
    --white:   #ffffff;
    --text:    #0f172a;
    --muted:   #64748b;
    --border:  #e2e8f0;
    --radius:  16px;
    --shadow:  0 4px 24px rgba(14,165,233,0.10);
  }

  <div style="padding:16px">
  <button onclick="processQR('{&quot;id&quot;:&quot;STB26-MXX260510924&quot;,&quot;nama&quot;:&quot;Test Peserta&quot;,&quot;sekolah&quot;:&quot;SMPIT&quot;}')" 
    style="width:100%;padding:14px;background:#0ea5e9;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700">
    🧪 Test Tanpa Scan QR
  </button>
</div>
  
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    color: var(--text);
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, var(--blue-dk) 0%, var(--blue) 100%);
    color: #fff;
    padding: 18px 20px 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 16px rgba(3,105,161,0.25);
  }
  .header-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .8;
    margin-bottom: 2px;
  }
  .header-title {
    font-size: 17px;
    font-weight: 800;
  }
  .header-clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    margin-top: 6px;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .header-date {
    font-size: 11px;
    opacity: .75;
    margin-top: 2px;
  }

  /* ── Layout ── */
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; }

  /* ── Scanner box ── */
  .scanner-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    margin-bottom: 16px;
    border: 1.5px solid var(--border);
  }
  .scanner-head {
    background: var(--blue-lt);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid #bae6fd;
  }
  .scanner-head-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
  .scanner-head span {
    font-size: 13px;
    font-weight: 700;
    color: var(--blue-dk);
  }

  .video-wrap {
    position: relative;
    width: 100%;
    background: #000;
    aspect-ratio: 1/1;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  /* QR target overlay */
  .qr-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .qr-frame {
    width: 55%;
    aspect-ratio: 1/1;
    border: 2.5px solid var(--gold);
    border-radius: 12px;
    box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
    animation: pulse-frame 2s ease-in-out infinite;
  }
  @keyframes pulse-frame {
    0%,100%{ border-color: var(--gold); }
    50%    { border-color: #fff; }
  }
  /* corner marks */
  .qr-frame::before, .qr-frame::after {
    content: '';
    position: absolute;
    width: 22px; height: 22px;
    border-color: var(--gold);
    border-style: solid;
  }
  .qr-frame::before { top:-2px; left:-2px; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
  .qr-frame::after  { bottom:-2px; right:-2px; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }

  .scanner-hint {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
    background: var(--white);
  }

  /* ── Result card ── */
  .result-card {
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 16px;
    display: none;
    animation: slideIn .3s ease;
    border: 1.5px solid transparent;
  }
  @keyframes slideIn {
    from { opacity:0; transform:translateY(-10px); }
    to   { opacity:1; transform:translateY(0); }
  }
  .result-card.success { background:var(--green-lt);  border-color:#6ee7b7; display:block; }
  .result-card.warn    { background:var(--warn-lt);   border-color:#fcd34d; display:block; }
  .result-card.error   { background:var(--red-lt);    border-color:#fca5a5; display:block; }

  .result-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .result-icon { font-size: 32px; line-height: 1; }
  .result-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .result-card.success .result-label { color: #065f46; }
  .result-card.warn    .result-label { color: #92400e; }
  .result-card.error   .result-label { color: #991b1b; }
  .result-nama  { font-size: 18px; font-weight: 800; color: var(--text); }
  .result-sekolah { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .result-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
  }
  .meta-chip {
    background: rgba(255,255,255,.7);
    border-radius: 8px;
    padding: 5px 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 5px;
    font-family: 'JetBrains Mono', monospace;
  }

  .result-msg {
    margin-top: 10px;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    line-height: 1.5;
  }

  /* status badge pojok kanan */
  .sheets-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    margin-top: 8px;
  }
  .sheets-status.ok      { background:#d1fae5; color:#065f46; }
  .sheets-status.fail    { background:#fee2e2; color:#991b1b; }
  .sheets-status.sending { background:#e0f2fe; color:#0369a1; }
  .sheets-dot { width:6px; height:6px; border-radius:50%; }
  .sheets-status.ok   .sheets-dot { background:#10b981; }
  .sheets-status.fail .sheets-dot { background:#ef4444; }
  .sheets-status.sending .sheets-dot { background:var(--blue); animation:blink 1s infinite; }

  /* ── Counter ── */
  .counter-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .counter-box {
    background: var(--white);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
  }
  .counter-num {
    font-size: 30px;
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    line-height: 1;
  }
  .counter-box.hadir  .counter-num { color: var(--green); }
  .counter-box.total  .counter-num { color: var(--blue); }
  .counter-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-top: 4px; }

  /* ── Log list ── */
  .log-card {
    background: var(--white);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    border: 1.5px solid var(--border);
    overflow: hidden;
  }
  .log-head {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
    color: var(--blue-dk);
    border-bottom: 1px solid var(--border);
    background: var(--blue-lt);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .log-clear {
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--white);
    transition: all .15s;
  }
  .log-clear:hover { background: var(--red-lt); color: var(--red); border-color:var(--red); }

  .log-list { max-height: 320px; overflow-y: auto; }
  .log-empty {
    text-align: center;
    padding: 28px;
    color: var(--muted);
    font-size: 13px;
  }
  .log-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border-bottom: 1px solid var(--border);
    animation: slideIn .25s ease;
  }
  .log-item:last-child { border-bottom: none; }
  .log-badge {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .log-badge.success { background: var(--green); }
  .log-badge.warn    { background: var(--warn); }
  .log-info { flex: 1; min-width: 0; }
  .log-nama  { font-size: 13px; font-weight: 700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .log-id    { font-size: 11px; color: var(--muted); font-family:'JetBrains Mono',monospace; }
  .log-time  { font-size: 12px; font-weight: 700; color: var(--blue); font-family:'JetBrains Mono',monospace; white-space:nowrap; }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <div class="header-label">Smart Teacher Bootcamp 2026</div>
  <div class="header-title">📷 Scanner Absensi Peserta</div>
  <div class="header-clock" id="clock">--:--:--</div>
  <div class="header-date" id="dateLabel">Memuat...</div>
</div>

<div class="wrap">

  <!-- ── Scanner ── -->
  <div class="scanner-card">
    <div class="scanner-head">
      <div class="scanner-head-dot"></div>
      <span>Kamera Aktif — Arahkan QR Code Peserta</span>
    </div>
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="canvas" style="display:none"></canvas>
      <div class="qr-overlay"><div class="qr-frame"></div></div>
    </div>
    <div class="scanner-hint">Posisikan QR di dalam bingkai emas ↑</div>
  </div>

  <!-- ── Result ── -->
  <div class="result-card" id="resultCard">
    <div class="result-top">
      <div class="result-icon" id="resultIcon"></div>
      <div>
        <div class="result-label" id="resultLabel"></div>
        <div class="result-nama"  id="resultNama"></div>
        <div class="result-sekolah" id="resultSekolah"></div>
      </div>
    </div>
    <div class="result-meta" id="resultMeta"></div>
    <div class="result-msg" id="resultMsg"></div>
    <div id="sheetsStatus"></div>
  </div>

  <!-- ── Counter ── -->
  <div class="counter-row">
    <div class="counter-box hadir">
      <div class="counter-num" id="cntHadir">0</div>
      <div class="counter-label">✅ Hadir Tercatat</div>
    </div>
    <div class="counter-box total">
      <div class="counter-num" id="cntScan">0</div>
      <div class="counter-label">📷 Total Scan</div>
    </div>
  </div>

  <!-- ── Log ── -->
  <div class="log-card">
    <div class="log-head">
      📋 Riwayat Kehadiran
      <button class="log-clear" onclick="clearLog()">Bersihkan</button>
    </div>
    <div class="log-list" id="logList">
      <div class="log-empty">Belum ada peserta yang di-scan</div>
    </div>
  </div>

</div><!-- /wrap -->

<script>
// ══════════════════════════════════════════════
//  KONFIGURASI
// ══════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPbLPDtelkzd0uR50DIk3K6RELV3etSQXpoUPYm2RkI6qe2APoINFC16Ie6Iy0enxK6A/exec';
const EVENT_PREFIX    = 'STB26';   // prefix peserta_id yang valid

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
const scannedIDs = new Set();
let cntHadir = 0, cntScan = 0;
let scanning  = true;
let resultTimer = null;

// ══════════════════════════════════════════════
//  JAM DIGITAL
// ══════════════════════════════════════════════
function updateClock() {
  const now  = new Date();
  const wita = new Date(now.getTime() + (8 * 60 * 60 * 1000)); // UTC+8

  const hh = String(wita.getUTCHours()).padStart(2,'0');
  const mm = String(wita.getUTCMinutes()).padStart(2,'0');
  const ss = String(wita.getUTCSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${hh}:${mm}:${ss} WITA`;

  const days = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  const months = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  document.getElementById('dateLabel').textContent =
    `${days[wita.getUTCDay()]}, ${wita.getUTCDate()} ${months[wita.getUTCMonth()]} ${wita.getUTCFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ══════════════════════════════════════════════
//  FORMAT WAKTU
// ══════════════════════════════════════════════
function getNowFormatted() {
  const now  = new Date();
  const wita = new Date(now.getTime() + (8 * 60 * 60 * 1000));

  const dd = String(wita.getUTCDate()).padStart(2,'0');
  const mo = String(wita.getUTCMonth()+1).padStart(2,'0');
  const yy = wita.getUTCFullYear();
  const hh = String(wita.getUTCHours()).padStart(2,'0');
  const mm = String(wita.getUTCMinutes()).padStart(2,'0');
  const ss = String(wita.getUTCSeconds()).padStart(2,'0');

  return {
    time:     `${hh}:${mm}:${ss}`,
    datetime: `${dd}/${mo}/${yy} ${hh}:${mm}:${ss}`,
    display:  `${hh}:${mm} WITA`
  };
}

// ══════════════════════════════════════════════
//  KAMERA & QR SCANNER
// ══════════════════════════════════════════════
const video  = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d', { willReadFrequently: true });

async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }
    });
    video.srcObject = stream;
    video.addEventListener('loadedmetadata', () => {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      requestAnimationFrame(scanFrame);
    });
  } catch(err) {
    alert('Tidak dapat mengakses kamera: ' + err.message +
      '\n\nPastikan browser mendapat izin kamera.');
  }
}

function scanFrame() {
  if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
    requestAnimationFrame(scanFrame);
    return;
  }

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const code = jsQR(imageData.data, imageData.width, imageData.height, {
    inversionAttempts: 'dontInvert'
  });

  if (code) {
    scanning = false; // pause scanner sementara
    processQR(code.data);
    setTimeout(() => { scanning = true; }, 3000); // resume 3 detik
  }

  requestAnimationFrame(scanFrame);
}

// ══════════════════════════════════════════════
//  PROSES QR
// ══════════════════════════════════════════════
function processQR(raw) {
  cntScan++;
  document.getElementById('cntScan').textContent = cntScan;

  let data;
  try {
    data = JSON.parse(raw);
  } catch(e) {
    // Coba sebagai plain string peserta_id
    if (raw.startsWith(EVENT_PREFIX)) {
      data = { id: raw, nama: raw, sekolah: '' };
    } else {
      showResult('error','❌','QR Tidak Valid','',
        'Format QR Code tidak dikenali. Pastikan menggunakan tiket resmi STB 2026.');
      return;
    }
  }

  // Validasi prefix event
  if (!data.id || !String(data.id).startsWith(EVENT_PREFIX)) {
    showResult('error','❌','Bukan Tiket STB 2026','',
      'QR Code ini bukan tiket Smart Teacher Bootcamp 2026.');
    return;
  }

  // Validasi field wajib
  if (!data.id || !data.nama) {
    showResult('error','❌','Data Tidak Lengkap','',
      'QR Code tidak memiliki data peserta yang lengkap.');
    return;
  }

  // Cek double scan
  if (scannedIDs.has(data.id)) {
    showResult('warn','⚠️', data.nama, data.sekolah || '—',
      'Peserta ini sudah tercatat hadir sebelumnya. Tidak dicatat ulang.',
      data.id, null, false);
    return;
  }

  // Catat hadir
  scannedIDs.add(data.id);
  cntHadir++;
  document.getElementById('cntHadir').textContent = cntHadir;

  const waktu = getNowFormatted();
  addToLog(data, waktu);
  showResult('success','✅', data.nama, data.sekolah || '—', null, data.id, waktu.display, true);
  saveAbsensi(data, waktu);
}

// ══════════════════════════════════════════════
//  KIRIM KE GOOGLE SHEETS
// ══════════════════════════════════════════════
async function saveAbsensi(data, waktu) {
  setSheetsStatus('sending', '⏳ Menyimpan ke Sheets...');

  const params = new URLSearchParams({
    action:      'absensi',
    peserta_id:  data.id,
    waktu_hadir: waktu.datetime
  });

  try {
    const res = await fetch(APPS_SCRIPT_URL + '?' + params.toString(), {
      method:   'GET',
      mode:     'cors',
      redirect: 'follow'
    });
    const json = await res.json();
    console.log('Sheets response:', json);

    if (json.status === 'success') {
      setSheetsStatus('ok', '✅ Tersimpan di Google Sheets');
    } else if (json.status === 'already') {
      setSheetsStatus('ok', '✅ Sudah tercatat sebelumnya');
    } else {
      setSheetsStatus('fail', '❌ Gagal: ' + (json.message || 'Unknown error'));
    }
  } catch(err) {
    console.error('Sheets error:', err);
    setSheetsStatus('fail', '❌ Tidak dapat terhubung ke Sheets');
  }
}

function setSheetsStatus(type, text) {
  const el = document.getElementById('sheetsStatus');
  if (!el) return;
  el.innerHTML = `
    <span class="sheets-status ${type}">
      <span class="sheets-dot"></span>${text}
    </span>`;
}

// ══════════════════════════════════════════════
//  TAMPILKAN HASIL
// ══════════════════════════════════════════════
function showResult(type, icon, nama, sekolah, msg, id, time, showSheets) {
  const card = document.getElementById('resultCard');
  card.className = 'result-card ' + type;

  document.getElementById('resultIcon').textContent    = icon;
  document.getElementById('resultNama').textContent    = nama;
  document.getElementById('resultSekolah').textContent = sekolah;

  document.getElementById('resultLabel').textContent =
    type === 'success' ? '✔ HADIR TERCATAT' :
    type === 'warn'    ? '⚠ SUDAH SCAN' : '✖ TIDAK VALID';

  // Meta chips
  const meta = document.getElementById('resultMeta');
  meta.innerHTML = '';
  if (id)   meta.innerHTML += `<div class="meta-chip">🆔 ${id}</div>`;
  if (time) meta.innerHTML += `<div class="meta-chip">🕐 ${time}</div>`;

  document.getElementById('resultMsg').textContent = msg || '';

  // Sheets status area
  const ss = document.getElementById('sheetsStatus');
  ss.innerHTML = showSheets
    ? '<span class="sheets-status sending"><span class="sheets-dot"></span>Menghubungkan ke Sheets...</span>'
    : '';

  // Auto hide setelah 5 detik
  if (resultTimer) clearTimeout(resultTimer);
  resultTimer = setTimeout(() => {
    card.className = 'result-card';
  }, 5000);
}

// ══════════════════════════════════════════════
//  LOG
// ══════════════════════════════════════════════
function addToLog(data, waktu) {
  const list = document.getElementById('logList');
  const empty = list.querySelector('.log-empty');
  if (empty) empty.remove();

  const item = document.createElement('div');
  item.className = 'log-item';
  item.innerHTML = `
    <div class="log-badge success"></div>
    <div class="log-info">
      <div class="log-nama">${data.nama}</div>
      <div class="log-id">${data.id}</div>
    </div>
    <div class="log-time">${waktu.time}</div>`;

  list.insertBefore(item, list.firstChild);
}

function clearLog() {
  const list = document.getElementById('logList');
  list.innerHTML = '<div class="log-empty">Belum ada peserta yang di-scan</div>';
}

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
startCamera();
</script>
</body>
</html>
